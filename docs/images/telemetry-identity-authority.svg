<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" role="img" aria-labelledby="title desc">
  <title id="title">Telemetry identity authority and lifecycle flow</title>
  <desc id="desc">A left-to-right lifecycle shows API-owned operator and aircraft identity, Agent-owned installation identity, Relay deployment and registration identities, optional API-owned flight and intent context, and ingestion-contract frame identity. Each node names its authority, creation event, and complete telemetry lifecycle rule.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #f8fafc; }
    .phase { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .apiNode { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
    .agentNode { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; }
    .relayNode { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.5; }
    .contractNode { fill: #fff7ed; stroke: #d97706; stroke-width: 2.5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    .context { fill: none; stroke: #2563eb; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#blueArrow); }
    .assignment { fill: #e0e7ff; stroke: #6366f1; stroke-width: 2.5; }
    .text { fill: #0f172a; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .muted { fill: #475569; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .title { font-size: 31px; font-weight: 760; }
    .phaseTitle { font-size: 17px; font-weight: 760; letter-spacing: 1px; }
    .id { font-size: 22px; font-weight: 780; }
    .authority { font-size: 15px; font-weight: 720; }
    .body { font-size: 14px; }
    .small { font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #07111f; }
      .phase { fill: #0c1728; stroke: #334155; }
      .apiNode { fill: #112c4d; stroke: #60a5fa; }
      .agentNode { fill: #123b35; stroke: #34d399; }
      .relayNode { fill: #2d2250; stroke: #c084fc; }
      .contractNode { fill: #382817; stroke: #fbbf24; }
      .assignment { fill: #202554; stroke: #818cf8; }
      .text { fill: #f1f5f9; }
      .muted { fill: #cbd5e1; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#64748b"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker>
  </defs>
  <rect class="bg" width="1600" height="1260" rx="24"/>
  <text class="text title" x="50" y="55">Authority is established before telemetry attribution</text>
  <text class="muted body" x="50" y="84">Durable business identity → installation assignment → Relay connection → optional operation context → retry-stable frame</text>

  <rect class="phase" x="35" y="115" width="430" height="1080" rx="24"/>
  <rect class="phase" x="485" y="115" width="420" height="1080" rx="24"/>
  <rect class="phase" x="925" y="115" width="640" height="1080" rx="24"/>
  <text class="muted phaseTitle" x="65" y="152">1 · DURABLE BUSINESS IDENTITY</text>
  <text class="muted phaseTitle" x="515" y="152">2 · INSTALLATION + CONNECTION</text>
  <text class="muted phaseTitle" x="955" y="152">3 · OPERATION + INGESTION</text>

  <!-- API durable identities feed assignment -->
  <rect class="apiNode" x="65" y="195" width="370" height="190" rx="20"/>
  <text class="text id" x="95" y="232">operator_id</text>
  <text class="text authority" x="95" y="258">Authority · Aero Arc API durable store</text>
  <text class="muted small" x="95" y="285">Created when an operator organization</text>
  <text class="muted small" x="95" y="305">is provisioned.</text>
  <text class="text body" x="95" y="335">Stable tenant identity. Relay obtains it from the</text>
  <text class="text body" x="95" y="358">authoritative Agent assignment and never infers it.</text>

  <rect class="apiNode" x="65" y="425" width="370" height="230" rx="20"/>
  <text class="text id" x="95" y="462">aircraft_id</text>
  <text class="text authority" x="95" y="488">Authority · Aero Arc API durable store</text>
  <text class="muted small" x="95" y="515">Created when an authenticated operator enrolls</text>
  <text class="muted small" x="95" y="535">a physical airframe.</text>
  <text class="text body" x="95" y="568">Immutable Aero Arc UUID. Registration, tail number,</text>
  <text class="text body" x="95" y="591">serial number, Remote ID, MAVLink system ID, and</text>
  <text class="text body" x="95" y="614">Agent ID are not substitutes.</text>

  <path class="flow" d="M435 290 C500 290 500 360 565 360"/>
  <path class="flow" d="M435 540 C500 540 500 405 565 405"/>

  <!-- Agent joins API assignment -->
  <rect class="agentNode" x="520" y="195" width="350" height="145" rx="20"/>
  <text class="text id" x="550" y="232">agent_id</text>
  <text class="text authority" x="550" y="258">Authority · Aero Arc Agent</text>
  <text class="muted small" x="550" y="285">Created when the Agent first initializes</text>
  <text class="muted small" x="550" y="305">its persisted identity.</text>
  <text class="text body" x="550" y="327">Installation, not aircraft; sent during registration</text>
  <text class="text body" x="550" y="347">and on frames; stable across WAL retries.</text>
  <path class="flow" d="M695 340 V365"/>
  <rect class="assignment" x="565" y="365" width="260" height="95" rx="22"/>
  <text class="text authority" x="695" y="401" text-anchor="middle">Authoritative assignment</text>
  <text class="muted body" x="695" y="427" text-anchor="middle">operator + aircraft + Agent</text>

  <!-- Relay deployment and session -->
  <rect class="relayNode" x="520" y="505" width="350" height="165" rx="20"/>
  <text class="text id" x="550" y="542">relay_id</text>
  <text class="text authority" x="550" y="568">Authority · Relay deployment identity</text>
  <text class="muted small" x="550" y="595">Created when a Relay instance or logical Relay</text>
  <text class="muted small" x="550" y="615">is provisioned.</text>
  <text class="text body" x="550" y="640">Relay that accepted the frame; configured or durably</text>
  <text class="text body" x="550" y="661">generated, never derived from network location.</text>
  <path class="flow" d="M695 460 V505"/>
  <path class="flow" d="M695 670 V715"/>

  <rect class="relayNode" x="520" y="715" width="350" height="185" rx="20"/>
  <text class="text id" x="550" y="752">session_id</text>
  <text class="text authority" x="550" y="778">Authority · Relay</text>
  <text class="muted small" x="550" y="805">Created by successful Agent registration.</text>
  <text class="text body" x="550" y="835">One accepted registration/connection lifecycle.</text>
  <text class="text body" x="550" y="858">New registration → new opaque ID.</text>
  <text class="text body" x="550" y="881">It is not the agent_id.</text>

  <!-- Optional API context flows to frame -->
  <rect class="apiNode" x="960" y="195" width="270" height="225" rx="20"/>
  <text class="text id" x="990" y="232">flight_id</text>
  <text class="text authority" x="990" y="258">Authority · Aero Arc API</text>
  <text class="text authority" x="990" y="279">flight workflow</text>
  <text class="muted small" x="990" y="306">Created explicitly with a flight record.</text>
  <text class="text body" x="990" y="337">Optional until assigned by the</text>
  <text class="text body" x="990" y="360">authoritative flight workflow.</text>
  <text class="text body" x="990" y="383">Never inferred from arming, takeoff,</text>
  <text class="text body" x="990" y="404">or MAVLink state.</text>

  <rect class="apiNode" x="1260" y="195" width="270" height="225" rx="20"/>
  <text class="text id" x="1290" y="232">intent_id</text>
  <text class="text authority" x="1290" y="258">Authority · Aero Arc API</text>
  <text class="text authority" x="1290" y="279">operational-intent workflow</text>
  <text class="muted small" x="1290" y="306">Created with an operational intent.</text>
  <text class="text body" x="1290" y="337">Optional telemetry context obtained</text>
  <text class="text body" x="1290" y="360">through the aircraft/flight association.</text>
  <text class="text body" x="1290" y="383">The normalizer must not infer it.</text>

  <path class="context" d="M1095 420 V520 H1180"/>
  <path class="context" d="M1395 420 V520 H1310"/>
  <rect class="assignment" x="1120" y="500" width="250" height="90" rx="22"/>
  <text class="text authority" x="1245" y="535" text-anchor="middle">Authoritative context</text>
  <text class="muted body" x="1245" y="561" text-anchor="middle">optional flight + intent</text>

  <!-- Session and context converge on frame -->
  <path class="flow" d="M870 807 H1015 V780 H1120"/>
  <path class="context" d="M1245 590 V690"/>
  <rect class="contractNode" x="1030" y="690" width="430" height="250" rx="22"/>
  <text class="text id" x="1060" y="730">frame_id</text>
  <text class="text authority" x="1060" y="758">Authority · Telemetry ingestion contract</text>
  <text class="muted small" x="1060" y="789">Created when a frame is written to the Agent WAL.</text>
  <text class="text body" x="1060" y="825">First-slice stable idempotency key:</text>
  <text class="text authority" x="1060" y="854">agent_id + capture time + WAL sequence</text>
  <text class="text body" x="1060" y="884">Unchanged across resend and reconnect.</text>
  <text class="muted body" x="1060" y="915">Session and optional context attribute the record;</text>
  <text class="muted body" x="1060" y="935">frame identity remains retry-stable.</text>

  <path class="flow" d="M1245 940 V1000"/>
  <rect class="assignment" x="960" y="1000" width="570" height="125" rx="24"/>
  <text class="text authority" x="1245" y="1040" text-anchor="middle">Normalized telemetry record</text>
  <text class="text body" x="1245" y="1071" text-anchor="middle">Relay uses authoritative context; it does not manufacture identity.</text>
  <text class="muted body" x="1245" y="1098" text-anchor="middle">Operator, aircraft, flight, and intent remain API-owned.</text>

  <text class="muted body" x="65" y="1155">Physical airframe identity is durable across registration corrections and replaceable components.</text>
  <text class="muted body" x="520" y="1155">Installation and connection identities have shorter, independent lifecycles.</text>
  <text class="muted body" x="960" y="1155">Operation context is optional; frame identity survives retries and reconnects.</text>
</svg>
