<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Layered stream synchronization ownership</title>
  <desc id="desc">Nested architecture diagram. The outer sessionsMu boundary protects the grpcSessions map and session identity replacement. Within a selected DroneSession, ownershipMu provides the retirement and frame-admission lease. sessionMu protects mutable state, active stream, and generation. Independent old and replacement bindings each have their own sendMu for that RPC stream. pendingMu separately protects the pending operation-command acknowledgement map.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #f8fafc; }
    .global { fill: #eef2ff; stroke: #6366f1; stroke-width: 3; }
    .lease { fill: #f0fdf4; stroke: #059669; stroke-width: 3; stroke-dasharray: 10 7; }
    .session { fill: #ffffff; stroke: #64748b; stroke-width: 2.5; }
    .bindingOld { fill: #fff7ed; stroke: #d97706; stroke-width: 2.5; }
    .bindingNew { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.5; }
    .pending { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
    .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .text { fill: #0f172a; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .muted { fill: #475569; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .title { font-size: 29px; font-weight: 760; }
    .layer { font-size: 22px; font-weight: 760; }
    .node { font-size: 18px; font-weight: 720; }
    .body { font-size: 15px; }
    .tag { font-size: 13px; font-weight: 760; letter-spacing: 1px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #07111f; }
      .global { fill: #151c3c; stroke: #818cf8; }
      .lease { fill: #0d2d29; stroke: #34d399; }
      .session { fill: #0f1c2e; stroke: #64748b; }
      .bindingOld { fill: #382817; stroke: #fbbf24; }
      .bindingNew { fill: #2d2250; stroke: #c084fc; }
      .pending { fill: #112c4d; stroke: #60a5fa; }
      .text { fill: #f1f5f9; }
      .muted { fill: #cbd5e1; }
    }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1200" height="850" rx="22"/>
  <text class="text title" x="45" y="54">Locks follow nested ownership scopes</text>
  <text class="muted body" x="45" y="82">Global identity → session lease → mutable session → independent stream sends and command correlation</text>

  <rect class="global" x="45" y="110" width="1110" height="690" rx="28"/>
  <text class="text layer" x="75" y="148">sessionsMu</text>
  <text class="muted tag" x="235" y="148">GLOBAL OWNERSHIP BOUNDARY</text>
  <text class="muted body" x="75" y="176">Protects the grpcSessions map and session identity replacement.</text>
  <rect x="75" y="200" width="185" height="55" rx="27" fill="#6366f1" opacity="0.18"/>
  <text class="text node" x="167" y="234" text-anchor="middle">grpcSessions[agent]</text>
  <path class="arrow" d="M260 227 H330"/>

  <rect class="lease" x="330" y="190" width="785" height="590" rx="25"/>
  <text class="text layer" x="360" y="230">ownershipMu</text>
  <text class="muted tag" x="525" y="230">RETIREMENT + FRAME-ADMISSION LEASE</text>
  <text class="muted body" x="360" y="257">Frames retain this read lease through routing; replacement and retirement take the write side.</text>

  <rect class="session" x="370" y="285" width="705" height="245" rx="22"/>
  <text class="text layer" x="400" y="325">sessionMu</text>
  <text class="muted tag" x="525" y="325">MUTABLE DRONE SESSION</text>
  <text class="muted body" x="400" y="352">Protects mutable session state, active stream, and stream generation.</text>
  <circle cx="465" cy="414" r="34" fill="#64748b" opacity="0.18"/>
  <text class="text node" x="465" y="420" text-anchor="middle">state</text>
  <path class="arrow" d="M500 414 H590"/>
  <circle cx="635" cy="414" r="45" fill="#7c3aed" opacity="0.20"/>
  <text class="text node" x="635" y="408" text-anchor="middle">active</text>
  <text class="text node" x="635" y="431" text-anchor="middle">stream</text>
  <path class="arrow" d="M680 414 H770"/>
  <rect x="770" y="380" width="250" height="68" rx="18" fill="#64748b" opacity="0.15"/>
  <text class="text node" x="895" y="407" text-anchor="middle">streamGeneration</text>
  <text class="muted body" x="895" y="431" text-anchor="middle">N → N+1</text>

  <path class="arrow" d="M635 460 V575 H485"/>
  <path class="arrow" d="M635 460 V575 H865"/>
  <rect class="bindingOld" x="365" y="560" width="330" height="135" rx="20"/>
  <text class="text node" x="395" y="598">Old stream binding</text>
  <text class="muted tag" x="395" y="626">BINDING sendMu</text>
  <text class="text body" x="395" y="654">Serializes sends on this RPC stream.</text>
  <text class="muted body" x="395" y="678">A blocked old send stays isolated.</text>

  <rect class="bindingNew" x="750" y="560" width="330" height="135" rx="20"/>
  <text class="text node" x="780" y="598">Replacement binding</text>
  <text class="muted tag" x="780" y="626">INDEPENDENT sendMu</text>
  <text class="text body" x="780" y="654">Serializes sends on this RPC stream.</text>
  <text class="muted body" x="780" y="678">Every replacement owns a new lock.</text>

  <path class="arrow" d="M722 530 V720"/>
  <rect class="pending" x="500" y="710" width="440" height="55" rx="18"/>
  <text class="text node" x="525" y="744">pendingMu</text>
  <text class="muted tag" x="650" y="744">PROTECTS THE PENDING OPERATION-COMMAND ACK MAP</text>
</svg>
